  /api/reportes/ventas:
    get:
      tags: [Reportes]
      x-roles: [Administrador]
      summary: Genera el reporte de ventas por periodo
      description: >
        Agrega los pagos cuya fecha de registro se encuentra dentro del
        periodo solicitado. Ambas fechas son inclusivas. Una venta corresponde
        a un pedido distinto que recibio al menos un pago durante el periodo.
      parameters:
        - name: fecha_inicio
          in: query
          required: true
          description: Primer dia incluido en el reporte.
          schema:
            type: string
            format: date
          example: "2026-09-01"
        - name: fecha_fin
          in: query
          required: true
          description: Ultimo dia incluido en el reporte.
          schema:
            type: string
            format: date
          example: "2026-09-30"
      responses:
        "200":
          description: Reporte generado, aunque el periodo no contenga pagos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteVentas"
        "400":
          description: Falta una fecha, su formato no es YYYY-MM-DD o el periodo esta invertido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"


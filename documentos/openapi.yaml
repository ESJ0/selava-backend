        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token emitido por /api/auth/login. Debe enviarse en el header
        Authorization con el formato Bearer <token>.

  responses:
    ErrorInterno:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NoAutenticado:
      description: Token faltante, mal formado, invalido o expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NoAutorizado:
      description: El rol del usuario no tiene permisos para el recurso
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ClienteNoEncontrado:
      description: No existe un cliente con ese ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ServicioNoEncontrado:
      description: No existe un servicio con ese ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    TipoPrendaNoEncontrado:
      description: No existe un tipo de prenda con ese ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    MetodoPagoNoEncontrado:
      description: No existe un metodo de pago con ese ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ErrorValidacion:
      description: Uno o mas campos no pasaron las validaciones de formato
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

  schemas:
    Insumo:
      type: object
      required: [id, nombre, unidad_medida, stock_actual, stock_minimo, activo, created_at, updated_at]
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          maxLength: 100
          example: Detergente
        descripcion:
          type: string
          maxLength: 255
          nullable: true
        unidad_medida:
          type: string
          maxLength: 20
          example: L
        stock_actual:
          type: number
          format: double
          minimum: 0
          example: 10
        stock_minimo:
          type: number
          format: double
          minimum: 0
          example: 5
        activo:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InsumoCreateRequest:
      type: object
      required: [nombre, unidad_medida]
      properties:
        nombre:
          type: string
          maxLength: 100
        descripcion:
          type: string
          maxLength: 255
          nullable: true
        unidad_medida:
          type: string
          maxLength: 20
        stock_actual:
          type: number
          format: double
          minimum: 0
          default: 0
        stock_minimo:
          type: number
          format: double
          minimum: 0
          default: 0

    InsumoUpdateRequest:
      type: object
      description: Todos los campos son opcionales; solo se actualizan los enviados.
      properties:
        nombre:
          type: string
          maxLength: 100
        descripcion:
          type: string
          maxLength: 255
          nullable: true
        unidad_medida:
          type: string
          maxLength: 20
        stock_actual:
          type: number
          format: double
          minimum: 0
        stock_minimo:
          type: number
          format: double
          minimum: 0
        activo:
          type: boolean

    MovimientoInventario:
      type: object
      required: [id, insumo_id, usuario_id, tipo_movimiento, cantidad, fecha_movimiento, created_at]
      properties:
        id:
          type: integer
        insumo_id:
          type: integer
        usuario_id:
          type: integer
        tipo_movimiento:
          type: string
          enum: [entrada, salida]
        cantidad:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
        motivo:
          type: string
          maxLength: 255
          nullable: true
        fecha_movimiento:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    MovimientoInventarioCreateRequest:
      type: object
      required: [insumo_id, tipo_movimiento, cantidad]
      properties:
        insumo_id:
          type: integer
          minimum: 1

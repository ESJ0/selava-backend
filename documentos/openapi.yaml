      tags: [Reportes]
      x-roles: [Administrador]
      summary: Cuenta los pedidos por su estado actual
      description: >
        Devuelve el total de pedidos activos agrupado por el estado actual.
        Incluye todos los estados del catalogo, aun cuando no tengan pedidos,
        ordenados segun el flujo configurado.
      responses:
        "200":

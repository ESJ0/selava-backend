openapi: 3.0.3
info:
  title: SeLava Backend API
  description: >
    API del sistema de gestion de la lavanderia SeLava (ventas, inventario,
    clientes, usuarios). Este documento cubre los endpoints implementados
    autenticacion, clientes, catalogos, pedidos, servicios por prenda,
    detalle, estados, pagos, inventario, reportes, historial y cancelacion.
  version: "1.9.0"

servers:
  - url: http://localhost:8080
    description: Entorno local de desarrollo

security:
  - bearerAuth: []

tags:
  - name: Salud
    description: Verificacion de disponibilidad del servicio
  - name: Autenticacion
    description: Login y emision de tokens JWT
  - name: Clientes
    description: Gestion de clientes de la lavanderia
  - name: Servicios
    description: Gestion del catalogo de servicios de la lavanderia
  - name: Tipos de Prenda
    description: Gestion del catalogo de tipos de prenda
  - name: Metodos de Pago
    description: Gestion del catalogo de metodos de pago aceptados
  - name: Pedidos
    description: Registro de pedidos de la lavanderia
  - name: Pagos
    description: Abonos, saldo pendiente e historial financiero de los pedidos
  - name: Insumos
    description: Catalogo y existencias de insumos de lavanderia
  - name: Movimientos de Inventario
    description: Entradas y salidas atomicas de existencias
  - name: Prendas
    description: Gestion de los servicios asociados a las prendas
  - name: Estados de Pedido
    description: Catalogo y flujo de estados de los pedidos
  - name: Reportes
    description: Indicadores financieros agregados para administracion

paths:
  /health:
    get:
      tags: [Salud]
      summary: Verifica que el servicio este en linea
      security: []
      responses:
        "200":
          description: El servicio esta funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/auth/login:
    post:
      tags: [Autenticacion]
      summary: Inicia sesion y devuelve un token JWT
      description: >
        Devuelve un token JWT que debe enviarse como Bearer token para
        consumir los endpoints protegidos del API.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Falta email o contrasena
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Email o contrasena incorrectos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/insumos/:
    get:
      tags: [Insumos]
      x-roles: [Administrador, Recepcionista, Operario]
      summary: Lista todos los insumos
      description: Devuelve insumos activos e inactivos con sus existencias actuales y minimas.
      responses:
        "200":
          description: Listado de insumos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Insumo"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    post:
      tags: [Insumos]
      x-roles: [Administrador, Recepcionista]
      summary: Crea un insumo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsumoCreateRequest"
      responses:
        "201":
          description: Insumo creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Insumo"
        "400":
          description: Cuerpo de la peticion invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          description: Ya existe un insumo con ese nombre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/insumos/alertas/stock-minimo:
    get:
      tags: [Insumos]
      x-roles: [Administrador, Recepcionista, Operario]
      summary: Lista insumos activos con stock bajo
      description: Devuelve insumos cuya existencia cumple stock_actual < stock_minimo.
      responses:
        "200":
          description: Insumos bajo el minimo configurado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Insumo"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/insumos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Insumos]
      x-roles: [Administrador, Recepcionista, Operario]
      summary: Obtiene un insumo por ID
      responses:
        "200":
          description: Insumo encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Insumo"
        "400":
          description: ID invalido
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          description: Insumo no encontrado
        "500":
          $ref: "#/components/responses/ErrorInterno"
    put:
      tags: [Insumos]
      x-roles: [Administrador, Recepcionista]
      summary: Actualiza los campos enviados de un insumo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsumoUpdateRequest"
      responses:
        "200":
          description: Insumo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Insumo"
        "400":
          description: ID o cuerpo de la peticion invalido
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          description: Insumo no encontrado
        "409":
          description: Ya existe un insumo con ese nombre
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    delete:
      tags: [Insumos]
      x-roles: [Administrador, Recepcionista]
      summary: Desactiva un insumo
      responses:
        "204":
          description: Insumo desactivado
        "400":
          description: ID invalido
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          description: Insumo no encontrado
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/movimientos-inventario/:
    post:
      tags: [Movimientos de Inventario]
      x-roles: [Administrador, Operario]
      summary: Registra una entrada o salida de inventario
      description: Actualiza el stock y crea el movimiento dentro de una misma transaccion. Rechaza salidas que superen el stock disponible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovimientoInventarioCreateRequest"
      responses:
        "201":
          description: Movimiento registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovimientoInventario"
        "400":
          description: Cuerpo de la peticion invalido
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          description: Insumo no encontrado
        "409":
          description: Stock insuficiente para registrar la salida
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/pedidos:
    get:
      tags: [Pedidos]
      x-roles: [Administrador, Recepcionista, Operario]
      summary: Lista pedidos con filtros y paginacion
      description: >
        Incluye pedidos activos, entregados y cancelados. La busqueda admite un ID,
        SLV-0001, nombre/apellido o telefono del cliente. Los filtros se combinan.
        Las fechas corresponden a fecha_recibido en horario de Guatemala (UTC-6)
        e incluyen completos los dias desde y hasta. El orden es estable por fecha e ID.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: estado_id
          in: query
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
        - name: fecha_desde
          in: query
          schema: { type: string, format: date }
        - name: fecha_hasta
          in: query
          schema: { type: string, format: date }
        - name: pagina
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: orden
          in: query
          schema: { type: string, enum: [recientes, antiguos], default: recientes }
      responses:
        "200":
          description: Pagina de pedidos; pedidos es un arreglo vacio si no hay resultados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoListResponse"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    post:
      tags: [Pedidos]
      summary: Crea un pedido junto con sus prendas
      description: >
        Asocia el pedido al cliente indicado y al usuario autenticado, y
        registra en la misma operacion todas las prendas incluidas. El
        estado inicial siempre se establece como Recibido. La creacion es
        atomica: si alguna prenda falla (por ejemplo, un tipo_prenda_id
        que no existe), no se crea el pedido ni ninguna de sus prendas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoCreateRequest"
      responses:
        "201":
          description: Pedido y prendas creados exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoConPrendas"
        "400":
          description: Cuerpo de la peticion invalido (JSON malformado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          description: No existe el cliente o alguno de los tipos de prenda indicados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/pedidos/{pedidoID}:
    get:
      tags: [Pedidos]
      x-roles: [Administrador, Recepcionista, Operario]
      summary: Consulta el detalle completo de un pedido
      description: Devuelve el pedido junto con su cliente, prendas, servicios asociados, estado actual y pagos.
      parameters:
        - name: pedidoID
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Detalle completo del pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoDetalle"
        "400":
          description: ID de pedido inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          description: El pedido no existe o está inactivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/pedidos/{pedidoID}/historial-estados:
    get:
      tags: [Pedidos]
      x-roles: [Administrador, Recepcionista, Operario]
      summary: Consulta el historial de estados de un pedido
      description: Devuelve todos los cambios de estado registrados para el pedido, ordenados desde el más antiguo al más reciente.
      parameters:
        - name: pedidoID
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Historial del pedido
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PedidoEstadoHistorialDetalle"
              example:
                - id: 12
                  pedido_id: 42
                  estado_id: 3
                  usuario_id: 7
                  fecha_cambio: "2026-09-07T16:30:00Z"
                  observaciones: Pedido listo para entrega
                  created_at: "2026-09-07T16:30:00Z"
                  estado: { id: 3, nombre: Rackeado, orden: 2 }
                  usuario: { id: 7, nombre: Ana, apellido: Martinez }
        "400":
          description: ID de pedido inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          description: El pedido no existe o está inactivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/pedidos/{pedidoID}/pagos:
    parameters:
      - name: pedidoID
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags: [Pagos]
      x-roles: [Administrador, Recepcionista]
      summary: Registra un pago o abono para un pedido
      description: Impide pagos en pedidos cancelados, sin saldo o cuyo monto exceda el saldo pendiente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagoCreateRequest"
      responses:
        "201":
          description: Pago registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagoDetalle"
        "400":
          description: ID o cuerpo de la peticion invalido
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          description: El pedido o metodo de pago no existe
        "409":
          description: Pedido cancelado, sin saldo o monto superior al saldo pendiente
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    get:
      tags: [Pagos]
      x-roles: [Administrador, Recepcionista]
      summary: Consulta el historial de pagos de un pedido
      responses:
        "200":
          description: Pagos ordenados del mas antiguo al mas reciente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PagoDetalle"
        "400":
          description: ID de pedido invalido
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          description: El pedido no existe o esta inactivo
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/pedidos/{pedidoID}/saldo:
    get:
      tags: [Pagos]
      x-roles: [Administrador, Recepcionista]
      summary: Consulta el saldo pendiente de un pedido
      parameters:
        - name: pedidoID
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Resumen del saldo del pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaldoPedido"
        "400":
          description: ID de pedido invalido
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          description: El pedido no existe o esta inactivo
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/pedidos/{pedidoID}/cancelar:
    put:
      tags: [Pedidos]
      x-roles: [Administrador, Recepcionista]
      summary: Cancela un pedido
      description: Marca el pedido como Cancelado y registra el cambio en el historial. Solo se permite mientras el pedido conserve el estado Recibido.
      parameters:
        - name: pedidoID
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Pedido cancelado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
        "400":
          description: ID de pedido inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          description: El pedido no existe o está inactivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El pedido ya inició el lavado o no puede cancelarse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/pedidos/{pedidoID}/estado:
    put:
      tags: [Pedidos]
      x-roles: [Administrador, Recepcionista, Operario]
      summary: Actualiza el estado actual de un pedido
      description: >
        Actualiza el estado del pedido y registra en el historial el usuario
        autenticado, la fecha del cambio y las observaciones opcionales. Ambas
        operaciones se realizan en una sola transaccion.
      parameters:
        - name: pedidoID
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoEstadoUpdateRequest"
            example:
              estado_id: 3
              observaciones: Pedido listo para entrega
      responses:
        "200":
          description: Estado actualizado e historial registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoEstadoHistorial"
        "400":
          description: ID de pedido o cuerpo de la peticion invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          description: El pedido o el estado indicado no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "409":
          description: El cambio retrocede el estado, el pedido ya fue entregado/cancelado o se intentó cancelar mediante este endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/estados-pedido/:
    get:
      tags: [Estados de Pedido]
      x-roles: [Administrador, Recepcionista, Operario]
      summary: Lista el catalogo de estados de pedido
      description: >
        Devuelve los estados ordenados por `orden`. El flujo configurado es
        Recibido (1), Rackeado (2), Entregado (3), con Cancelado (99) como
        salida excepcional. Requiere JWT y admite cualquiera de los tres roles.
      responses:
        "200":
          description: Catalogo ordenado de estados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EstadoPedido"
              example:
                - { id: 1, nombre: Recibido, orden: 1, created_at: "2026-09-07T15:00:00Z", updated_at: "2026-09-07T15:00:00Z" }
                - { id: 3, nombre: Rackeado, orden: 2, created_at: "2026-09-07T15:00:00Z", updated_at: "2026-09-07T15:00:00Z" }
                - { id: 4, nombre: Entregado, orden: 3, created_at: "2026-09-07T15:00:00Z", updated_at: "2026-09-07T15:00:00Z" }
                - { id: 2, nombre: Cancelado, orden: 99, created_at: "2026-09-07T15:00:00Z", updated_at: "2026-09-07T15:00:00Z" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/prendas/{prendaID}/servicios:
    post:
      tags: [Prendas]
      x-roles: [Administrador, Recepcionista]
      summary: Asocia un servicio a una prenda existente
      description: >
        Captura el precio base vigente del servicio como precio aplicado y
        recalcula el total del pedido al que pertenece la prenda.
      parameters:
        - name: prendaID
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrendaServicioCreateRequest"
            example:
              servicio_id: 3
      responses:
        "201":
          description: Servicio asociado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrendaServicio"
        "400":
          description: ID de prenda o cuerpo de la peticion invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          description: La prenda o el servicio activo no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El servicio ya esta asociado o el pedido ya fue entregado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/prendas/{prendaID}/servicios/{servicioID}:
    delete:
      tags: [Prendas]
      x-roles: [Administrador, Recepcionista]
      summary: Quita un servicio de una prenda existente
      description: Quita la asociacion y recalcula el total del pedido.
      parameters:
        - name: prendaID
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: servicioID
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Servicio quitado exitosamente
        "400":
          description: ID de prenda o servicio invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/NoAutorizado"
        "404":
          description: La prenda o la asociacion no existe
          content:
            application/json:

        "403":
          $ref: "#/components/responses/NoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /api/reportes/consumo-insumos:
    get:
      tags: [Reportes]
      x-roles: [Administrador]
      summary: Genera el reporte de consumo de insumos por periodo
      description: >
        Suma exclusivamente los movimientos de inventario de tipo salida cuya
        fecha se encuentra dentro del periodo solicitado. Ambas fechas son
        inclusivas y el consumo se agrupa por insumo.
      parameters:
        - name: fecha_inicio
          in: query
          required: true
          description: Primer dia incluido en el reporte.
          schema:
            type: string
            format: date
          example: "2026-09-01"
        - name: fecha_fin

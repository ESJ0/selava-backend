        total_ventas: 21.25
        ventas_por_dia:
          - fecha: "2026-09-01"
            cantidad_ventas: 1
            cantidad_pagos: 1
            total_ventas: 5
        ventas_por_metodo_pago:
          - metodo_pago: { id: 1, nombre: Efectivo, activo: true }
            cantidad_ventas: 2
            cantidad_pagos: 2
            total_ventas: 15


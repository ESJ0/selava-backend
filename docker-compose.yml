services:
  postgres:
    image: postgres:16
    container_name: lavanderia-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lavanderia
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lavanderia"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
